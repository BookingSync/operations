name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rspec:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ruby: '3.2', rails: '7.2' }
          - { ruby: '3.3', rails: '8.0' }
          - { ruby: '3.4', rails: '8.1' }
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/rails.${{ matrix.rails }}.gemfile
    steps:
    - uses: actions/checkout@v2
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - run: bundle exec rspec

  rubocop:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.2
        bundler-cache: true
    - run: bundle exec rubocop
